# Codemagic — CEN Corse (Capacitor + Next export)
# Doc : https://docs.codemagic.io/yaml-quick-start/building-a-capacitor-app/
#
# Prérequis Codemagic (app cen-corse-app > Environment variables, groupe cen_corse) :
# - NEXT_PUBLIC_SUPABASE_URL
# - NEXT_PUBLIC_SUPABASE_ANON_KEY (Secure)
# - APPLE_TEAM_ID (10 caractères, developer.apple.com > Membership > Team ID)
# - CERTIFICATE_PRIVATE_KEY (optionnel après 1er build réussi — clé RSA du certificat Distribution)
#
# Team integrations : app_store_connect_cen_corse (clé API App Store Connect)

workflows:
  cencorse-ios-release:
    name: CEN Corse iOS (App Store)
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: app_store_connect_cen_corse

    environment:
      groups:
        - cen_corse
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        BUNDLE_ID: com.cencorse.app
        APP_STORE_APPLE_ID: 6775281276
      node: 20
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Dépendances npm
        script: npm ci

      - name: Build web Capacitor + sync iOS
        script: npm run build:capacitor

      - name: CocoaPods
        script: cd ios/App && pod install

      - name: Keychain
        script: keychain initialize

      - name: Certificats et profils Apple
        script: |
          KEY_PATH="/tmp/ios_distribution_key.pem"
          if [ -n "$CERTIFICATE_PRIVATE_KEY" ]; then
            printf '%s\n' "$CERTIFICATE_PRIVATE_KEY" > "$KEY_PATH"
          else
            openssl genrsa -out "$KEY_PATH" 2048
          fi
          chmod 600 "$KEY_PATH"
          export CERTIFICATE_PRIVATE_KEY="$(cat "$KEY_PATH")"
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key "@file:$KEY_PATH" \
            --verbose \
          || app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@file:$KEY_PATH" \
            --verbose

      - name: Ajout certificats au keychain
        script: keychain add-certificates

      - name: Team ID dans le projet Xcode
        script: |
          if [ -z "$APPLE_TEAM_ID" ]; then
            echo "ERREUR: ajoutez APPLE_TEAM_ID dans Codemagic (groupe cen_corse)."
            echo "Trouvable sur developer.apple.com > Account > Membership > Team ID"
            exit 1
          fi
          PBX="ios/App/App.xcodeproj/project.pbxproj"
          sed -i.bak 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBX"
          perl -i -pe "s/(CODE_SIGN_STYLE = Manual;)/\$1\n\t\t\t\tDEVELOPMENT_TEAM = $APPLE_TEAM_ID;/ unless /DEVELOPMENT_TEAM =/" "$PBX"

      - name: Numéro de build iOS
        script: |
          cd ios/App
          LATEST=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $((LATEST + 1))

      - name: Configuration signature Xcode
        script: xcode-project use-profiles --code-signing-setup-verbose-logging

      - name: IPA App Store
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
